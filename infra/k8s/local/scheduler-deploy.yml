apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: scheduler
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_URI
              value: "mongodb://scheduler-mongo-srv:27017/scheduler"
            - name: NATS_URL
              value: "nats://nats-srv:4222"
            - name: NODE_ENVIRONEMENT
              value: development
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # GOOGLE SECRETS
            - name: GOOGLE_PROJECT_ID
              value: swe-challenge-484714
            - name: GOOGLE_STORAGE_BUCKET
              value: swe-challenge-data
            - name: GOOGLE_STORAGE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: swe-challenge-email
                  key: GOOGLE_STORAGE_EMAIL
            - name: GOOGLE_STORAGE_SSH
              valueFrom:
                secretKeyRef:
                  name: swe-challenge-ssh
                  key: GOOGLE_STORAGE_SSH
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-srv
spec:
  selector:
    app: scheduler
  ports:
    - name: scheduler
      port: 3000
      targetPort: 3000
